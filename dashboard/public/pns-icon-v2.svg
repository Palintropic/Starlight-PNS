<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>PNS</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241A52"/>
      <stop offset="1" stop-color="#0E0A24"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- reference ring with a fixed amber mark: the "true" position -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="#5B46A3" stroke-width="2.5"/>
  <path d="M27 6.5 A26 26 0 0 1 37 6.5" fill="none" stroke="#FFB454" stroke-width="3.4" stroke-linecap="round"/>
  <!-- drifted copy of the moon, offset and faint -->
  <path fill="#8E6BD9" fill-opacity=".38" transform="translate(0 4)"
        d="M31.19 14.04 A19 19 0 1 0 46.73 42.01 A16 16 0 0 1 31.19 14.04 Z"/>
  <!-- corrected moon -->
  <path fill="#EDE7FF" transform="translate(4 -1)"
        d="M31.19 14.04 A19 19 0 1 0 46.73 42.01 A16 16 0 0 1 31.19 14.04 Z"/>
</svg>
