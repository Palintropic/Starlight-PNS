# 语气研究发现（2026-07-21之后）
tone_research:
  finding: "语气压缩不是固定值，而是由情绪浓度决定"
  compression_levels:
    - level: 日常/平淡
      behavior: 极简压缩，一句话一个意思，不拆确认
    - level: 情绪浓度高
      behavior: 展开描述，可以用多个感叹号或省略号
    - level: 意外/不对劲
      behavior: 用省略号中断，只留反应词不给因果
    - level: 察觉到深意但不想说
      behavior: 省略号收尾留白，不追问不评论

