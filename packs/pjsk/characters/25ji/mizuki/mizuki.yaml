    v1_score: "0/10"
    v2_after_router_fix: "短句子但多个确认问题"
    v2_score: "5/10 (结构改进但压缩不够)"
    v3_density_constraint: "啊哈？你帮别人搜结果自己先聊上了，挺好玩的嘛呼呼～"
    v3_score: "8/10 (压缩到位但游戏知识度不足)"
    v3_note: "剩余2分gap来自游戏设定知识深度，非结构问题"

