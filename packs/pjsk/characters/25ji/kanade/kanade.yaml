# packs/pjsk/characters/25ji/kanade/kanade.yaml
character_id: kanade
name: 宵崎奏
name_jp: 宵崎奏

unit: 25ji
role: 作曲人
school: 通信制高校
school_note: "正式高中学籍类型（与全日制/定时制并列），核心特征是不必每天到校，以自学+提交报告为主，每年仅需数天到数十天面授；不等于'没有学籍'或'居家自学'"
grade: null
class: null
class_note: "不套用神山高校/宫益坂女子学院的班级号体系，无对应班级号"

# 结构化日常作息（CONTENT-2）。写法同 mizuki.yaml：每段从 at 起管到下一段开始，最后一段
# 跨零点接回第一段；地点变化时 at 是到达时刻，出发时刻按路程倒推。
# 官方只给粗粒度事实：通信制、课程全在线（不建模到校）；在家作曲、作曲压过睡眠与吃饭；
# 25 時集合；真冬离家后暂住宵崎家。每一个精确时刻都是推断。
daily_rhythm:
  - at: "01:00"        # 25時上线是官方的；此刻在哪个房间是推断
    activity: online_chatting
    location_id: kanade_home_room
    channel_id: nightcord
    source: inferred
  - at: "02:00"        # 真冬这时下线在房里睡；奏挪到公共区域继续挂着，不对着睡着的人说话
    activity: online_chatting
    location_id: kanade_home
    channel_id: nightcord
    source: inferred
  - at: "04:00"        # 真冬下线后奏还会继续一会（研究 #12）；之后接着作曲
    activity: composing
    location_id: kanade_home
    source: inferred
  - at: "08:00"        # 真冬出门上学之后，奏回房间
    activity: composing
    location_id: kanade_home_room
    source: inferred
  - at: "09:00"        # 补眠（研究 #4：作曲压过睡眠，没有固定起止）
    activity: resting
    location_id: kanade_home_room
    source: inferred
  - at: "14:00"        # 研究 #5 不支持固定饭点，醒来直接作曲
    activity: composing
    location_id: kanade_home_room
    source: inferred
  - at: "19:00"        # 和暂住的真冬一起吃晚饭；建模上的让步，不是官方习惯
    activity: eating
    location_id: kanade_home
    source: inferred
  - at: "19:40"
    activity: composing
    location_id: kanade_home_room
    source: inferred

access_grants:
  locations:
    - location_id: kanade_home
      role: household
    - location_id: kanade_home_room
      role: household
  channels:
    - nightcord

status: ready
sample_coverage: 1.0  # 三件套齐全时的占位值，评分口径未最终确定，后续可能重新定义

prompt_file: kanade_prompt.md
prompt_file_compat: kanade_prompt_compat.md
constitution_file: kanade_constitution.md
router_reference_file: kanade_router_reference.md

family:
  - relation: 母亲
    name: null
    note: "已故（官方明确），奏年幼时因病去世，具体病名/日期未公开。喜欢康乃馨，童年家庭回忆集中在 Carnation Recollection"
  - relation: 父亲
    name: null
    note: "仍在世、长期住院，未离异也非已故，是接委托维生的自由作曲家。因长期过劳倒下，留有严重记忆障碍，间歇清醒并逐渐恢复。官方文本不支持'长期昏迷/昏睡'或'中风/植物人'等具体诊断"
  - relation: 祖母
    name: null
    note: "姓名未公开，因健康问题住院观察而未与奏同住，因担心奏无法照顾自己而联系家政中心，安排穗波升高中后定期照顾"
  - relation: 兄弟姐妹等
    name: null
    note: "官方未公开提及"
