name: Python tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints-prod.txt

      # 生产进程测试要一份构建好的 Dashboard（跟镜像一样）；没有就跳过的话，
      # CI 永远不会真的起一次生产服务器。Node 版本跟 Dockerfile 的 dashboard 阶段一致。
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build and test the dashboard
        working-directory: dashboard
        run: |
          npm ci
          npm test
          npm run lint
          npm run build
          test -f dist/index.html

      - name: Run tests
        env:
          # 缺 Dashboard 构建产物时生产进程测试失败，而不是跳过。
          PNS_REQUIRE_DIST: "1"
        run: python -m unittest discover -s tests

      # bench/ 是独立的测评框架，测试不在 tests/ 下，上面那条不会发现它们。
      - name: Run bench tests
        run: python -m unittest discover -s bench/tests -t .

      - name: Compile Python sources
        run: python -m compileall -q pns tests bench

  amd64-image:
    name: Build and verify amd64 image
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      SMOKE_IMAGE: starlight-pns:git-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install smoke test dependency
        run: python -m pip install -c constraints-prod.txt argon2-cffi

      - name: Build and run Docker smoke tests
        env:
          SMOKE_PLATFORM: linux/amd64
        run: bash scripts/docker_smoke.sh

      - name: Package the tested image
        run: |
          platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$SMOKE_IMAGE")"
          if [[ "$platform" != linux/amd64 ]]; then
            echo "Unexpected image platform: $platform" >&2
            exit 1
          fi
          image_id="$(docker image inspect --format '{{.Id}}' "$SMOKE_IMAGE")"
          mkdir -p "$RUNNER_TEMP/pns-image"
          cd "$RUNNER_TEMP/pns-image"
          docker image save "$SMOKE_IMAGE" | gzip -n > starlight-pns-linux-amd64.tar.gz
          sha256sum starlight-pns-linux-amd64.tar.gz > SHA256SUMS
          printf 'commit=%s\nimage=%s\nimage_id=%s\nplatform=%s\n' \
            "$GITHUB_SHA" "$SMOKE_IMAGE" "$image_id" "$platform" > image.txt

      - name: Upload tested image archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: starlight-pns-linux-amd64-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pns-image/starlight-pns-linux-amd64.tar.gz
            ${{ runner.temp }}/pns-image/SHA256SUMS
            ${{ runner.temp }}/pns-image/image.txt
          if-no-files-found: error
          compression-level: 0
